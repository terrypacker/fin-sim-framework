<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Workbench V5 - Docking System</title>

<style>
:root {
  --bg:#0e1116;
  --panel:#171b21;
  --panel2:#1e242c;
  --border:1px solid rgba(255,255,255,0.07);
  --text:#e7edf5;
  --muted:#93a1b3;
  --accent:#5aa2ff;

  font-family: system-ui, sans-serif;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

/* =======================================================
   ROOT
======================================================= */

#app {
  display:grid;
  grid-template-rows:48px 1fr;
  height:100vh;
}

/* =======================================================
   TOP BAR
======================================================= */

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:var(--panel);
  border-bottom:var(--border);
}

/* =======================================================
   DOCK AREA
======================================================= */

#dockRoot {
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* =======================================================
   SPLIT CONTAINERS
======================================================= */

.split {
  position:absolute;
  inset:0;
  display:flex;
}

.split.horizontal {
  flex-direction:row;
}

.split.vertical {
  flex-direction:column;
}

/* =======================================================
   PANE
======================================================= */

.pane {
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--panel);
  border-right:var(--border);
}

.split.vertical > .pane {
  border-right:none;
  border-bottom:var(--border);
}

/* =======================================================
   GUTTER
======================================================= */

.gutter {
  background:rgba(255,255,255,0.04);
  z-index:10;
}

.gutter.horizontal {
  width:6px;
  cursor:col-resize;
}

.gutter.vertical {
  height:6px;
  cursor:row-resize;
}

/* =======================================================
   TAB BAR
======================================================= */

.tabs {
  display:flex;
  background:var(--panel2);
  border-bottom:var(--border);
  min-height:32px;
  align-items:center;
}

.tab {
  padding:6px 10px;
  cursor:pointer;
  font-size:12px;
  color:var(--muted);
}

.tab.active {
  color:white;
  background:rgba(90,162,255,0.12);
}

/* =======================================================
   VIEWPORT
======================================================= */

.view {
  flex:1;
  overflow:auto;
  padding:10px;
}

/* =======================================================
   CARD
======================================================= */

.card {
  background:var(--panel2);
  border:var(--border);
  padding:10px;
  margin-bottom:8px;
  border-radius:10px;
}

.small {
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div id="app">

  <div class="top">
    <div><b>Workbench V5 Docking</b></div>
    <div class="small">Split + Resize + Tabs</div>
  </div>

  <div id="dockRoot"></div>

</div>

<script>

/* =======================================================
   SIMPLE EVENT BUS
======================================================= */

const bus = {
  map:{},
  on(e,f){ (this.map[e]??=[]).push(f) },
  emit(e,p){ (this.map[e]||[]).forEach(fn=>fn(p)) }
};

/* =======================================================
   COMPONENT SYSTEM (from V4 concept)
======================================================= */

class Component {
  mount(container) {
    this.el = this.render();
    container.appendChild(this.el);
  }
  unmount() {
    this.el?.remove();
  }
}

/* =======================================================
   SAMPLE COMPONENTS
======================================================= */

class Timeline extends Component {
  render() {
    const d = document.createElement("div");
    d.innerHTML = `
      <div class="card"><b>Timeline</b></div>
      <div class="card">Roth Conversion</div>
      <div class="card">Retirement Phase</div>
      <div class="card">FIRE</div>
    `;
    return d;
  }
}

class Graph extends Component {
  render() {
    const d = document.createElement("div");
    d.innerHTML = `<div class="card"><b>Graph Trace</b></div>`;
    return d;
  }
}

class MonteCarlo extends Component {
  render() {
    const d = document.createElement("div");
    d.innerHTML = `<div class="card"><b>Monte Carlo</b></div>`;
    return d;
  }
}

/* =======================================================
   TAB SYSTEM
======================================================= */

class TabGroup {

  constructor(pane, tabs=[]) {
    this.pane = pane;
    this.tabs = tabs;
    this.active = tabs[0]?.id;
    this.components = {};
  }

  mount(container) {

    this.el = document.createElement("div");

    this.tabsEl = document.createElement("div");
    this.tabsEl.className = "tabs";

    this.viewEl = document.createElement("div");
    this.viewEl.className = "view";

    this.el.appendChild(this.tabsEl);
    this.el.appendChild(this.viewEl);

    container.appendChild(this.el);

    this.renderTabs();
    this.renderActive();
  }

  renderTabs() {

    this.tabsEl.innerHTML = "";

    this.tabs.forEach(t => {

      const el = document.createElement("div");
      el.className = "tab " + (t.id===this.active?"active":"");
      el.textContent = t.title;

      el.onclick = () => {
        this.active = t.id;
        this.renderTabs();
        this.renderActive();
      };

      this.tabsEl.appendChild(el);
    });
  }

  renderActive() {

    this.viewEl.innerHTML = "";

    const tab = this.tabs.find(t => t.id === this.active);

    const comp = new tab.component();
    comp.mount(this.viewEl);

    this.components[this.active] = comp;
  }

  unmount() {
    Object.values(this.components).forEach(c => c.unmount());
    this.el?.remove();
  }
}

/* =======================================================
   SPLIT SYSTEM
======================================================= */

class Split {

  constructor(direction, children, sizes=[0.5,0.5]) {
    this.direction = direction;
    this.children = children;
    this.sizes = sizes;
  }

  mount(container) {

    this.el = document.createElement("div");
    this.el.className = "split " + this.direction;

    this.childEls = [];

    this.children.forEach((child, i) => {

      const pane = document.createElement("div");
      pane.className = "pane";
      pane.style.flex = this.sizes[i];

      child.mount(pane);

      this.el.appendChild(pane);
      this.childEls.push(pane);

      if (i < this.children.length - 1) {
        const g = document.createElement("div");
        g.className = "gutter " +
          (this.direction === "horizontal" ? "horizontal" : "vertical");

        this.attachResize(g, i, pane);
        this.el.appendChild(g);
      }
    });

    container.appendChild(this.el);
  }

  attachResize(gutter, index, pane) {

    let start;

    gutter.onmousedown = (e) => {

      start = this.direction === "horizontal"
        ? e.clientX
        : e.clientY;

      const move = (ev) => {

        const current = this.direction === "horizontal"
          ? ev.clientX
          : ev.clientY;

        const delta = current - start;

        const percentDelta = delta / window.innerWidth;

        const flex = parseFloat(pane.style.flex);

        pane.style.flex = Math.max(0.1, flex + percentDelta);

        start = current;
      };

      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
      };

      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    };
  }

  unmount() {
    this.children.forEach(c => c.unmount());
    this.el?.remove();
  }
}

/* =======================================================
   BUILD LAYOUT TREE
======================================================= */

function buildLayout() {

  return new Split("horizontal", [

    // LEFT
    new TabGroup("left", [
      { id:"timeline", title:"Timeline", component: Timeline },
      { id:"graph", title:"Graph", component: Graph }
    ]),

    // CENTER (nested split)
    new Split("vertical", [

      new TabGroup("center-top", [
        { id:"mc", title:"Monte Carlo", component: MonteCarlo },
        { id:"graph2", title:"Graph", component: Graph }
      ]),

      new TabGroup("center-bottom", [
        { id:"log", title:"Log", component: Graph }
      ])

    ]),

    // RIGHT
    new TabGroup("right", [
      { id:"inspect", title:"Inspector", component: Graph }
    ])

  ]);
}

/* =======================================================
   RENDER
======================================================= */

let rootLayout;

function render() {

  const root = document.getElementById("dockRoot");
  root.innerHTML = "";

  if (rootLayout) rootLayout.unmount();

  rootLayout = buildLayout();
  rootLayout.mount(root);
}

render();

</script>

</body>
</html>
