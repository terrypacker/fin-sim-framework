<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simulation Workbench V4</title>

<style>
:root {
  --bg:#0f1216;
  --panel:#171b21;
  --panel2:#1e242c;
  --border:1px solid rgba(255,255,255,0.06);
  --text:#e7edf5;
  --muted:#93a1b3;

  --accent:#5aa2ff;

  --left:240px;
  --right:340px;
  --top:48px;
  --bottom:180px;

  font-family: system-ui, sans-serif;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* =======================================================
   APP
======================================================= */

.app {
  display:grid;
  grid-template-columns:56px 1fr;
  height:100vh;
}

/* =======================================================
   WORKSPACE SWITCHER
======================================================= */

.activity {
  background:#0b0e12;
  border-right:var(--border);
  display:flex;
  flex-direction:column;
  padding:10px 0;
  gap:10px;
  align-items:center;
}

.btn {
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.btn.active {
  background:rgba(90,162,255,0.15);
  color:white;
}

/* =======================================================
   MAIN
======================================================= */

.main {
  display:grid;
  grid-template-rows:var(--top) 1fr var(--bottom);
  overflow:hidden;
}

/* =======================================================
   TOP BAR
======================================================= */

.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:var(--panel);
  border-bottom:var(--border);
}

/* =======================================================
   WORKSPACE GRID
======================================================= */

.workspace {
  display:grid;
  grid-template-columns:var(--left) 1fr var(--right);
  overflow:hidden;
}

/* =======================================================
   PANELS
======================================================= */

.panel {
  background:var(--panel);
  border-right:var(--border);
  overflow:auto;
}

.panel.right {
  border-right:none;
  border-left:var(--border);
}

.center {
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =======================================================
   VIEWPORT
======================================================= */

.viewport {
  flex:1;
  overflow:auto;
  padding:12px;
}

/* =======================================================
   COMMON UI
======================================================= */

.card {
  background:var(--panel2);
  border:var(--border);
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.small {
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div class="app">

  <div class="activity" id="ws"></div>

  <div class="main">

    <div class="top">
      <div><b>Workbench V4</b></div>
      <div class="small">Component Lifecycle Model</div>
    </div>

    <div class="workspace">

      <div class="panel" id="left"></div>

      <div class="center">
        <div id="viewport" class="viewport"></div>
      </div>

      <div class="panel right" id="right"></div>

    </div>

    <div class="panel" id="bottom"></div>

  </div>
</div>

<script>

/* =======================================================
   EVENT BUS
======================================================= */

const bus = {
  map:{},
  on(e,f){ (this.map[e]??=[]).push(f) },
  emit(e,p){ (this.map[e]||[]).forEach(fn=>fn(p)) }
};

/* =======================================================
   GLOBAL STATE
======================================================= */

const state = {
  workspace: "runtime",
  selection: null
};

/* =======================================================
   COMPONENT BASE CLASS
======================================================= */

class Component {
  constructor(state, bus) {
    this.state = state;
    this.bus = bus;
    this.el = null;
  }

  mount(container) {
    this.el = this.render();
    container.appendChild(this.el);
  }

  unmount() {
    if (this.el) {
      this.el.remove();
      this.el = null;
    }
  }

  render() {
    throw new Error("render() not implemented");
  }
}

/* =======================================================
   PANEL COMPONENTS
======================================================= */

class ScenarioPanel extends Component {
  render() {
    const div = document.createElement("div");
    div.innerHTML = `
      <div class="card">
        <b>Scenario</b>
        <div class="small">Config + setup</div>
      </div>

      <div class="card">
        <b>Load / Save</b>
        <div class="small">Import/export JSON</div>
      </div>
    `;
    return div;
  }
}

class TimePanel extends Component {
  render() {
    const div = document.createElement("div");
    div.innerHTML = `
      <div class="card"><b>Time Controls</b></div>
      <div class="card small">Play / Step / Reset</div>
    `;
    return div;
  }
}

class TimelinePanel extends Component {

  render() {

    const div = document.createElement("div");

    const data = [
      { id:"a", t:"2028", label:"Roth Conversion" },
      { id:"b", t:"2029", label:"Retirement Phase" },
      { id:"c", t:"2031", label:"FIRE" }
    ];

    div.innerHTML = `
      <div class="card"><b>Timeline</b></div>
    `;

    data.forEach(e => {
      const row = document.createElement("div");
      row.className = "card";
      row.innerHTML = `<b>${e.label}</b><div class="small">${e.t}</div>`;

      row.onclick = () => {
        state.selection = e.id;
        bus.emit("selection.changed", e);
        this.rerender();
      };

      div.appendChild(row);
    });

    return div;
  }

  rerender() {
    const parent = this.el.parentNode;
    this.unmount();
    this.mount(parent);
  }
}

class StatePanel extends Component {
  render() {
    const div = document.createElement("div");

    div.innerHTML = `
      <div class="card">
        <b>Live State</b>
        <div class="small">
          selection: ${state.selection ?? "none"}
        </div>
      </div>
    `;

    return div;
  }
}

/* =======================================================
   WORKSPACE DEFINITIONS
======================================================= */

const workspaces = {

  runtime: {
    name: "Runtime",
    left: () => [
      new ScenarioPanel(state, bus),
      new TimePanel(state, bus)
    ],
    center: () => [
      new TimelinePanel(state, bus)
    ],
    right: () => [
      new StatePanel(state, bus)
    ]
  },

  graph: {
    name: "Graph",
    left: () => [
      new ScenarioPanel(state, bus)
    ],
    center: () => [],
    right: () => [
      new StatePanel(state, bus)
    ]
  }
};

/* =======================================================
   ACTIVE COMPONENTS TRACKING
======================================================= */

let active = {
  left: [],
  center: [],
  right: [],
  bottom: []
};

/* =======================================================
   RENDER ENGINE (MOUNT / UNMOUNT LIFECYCLE)
======================================================= */

function renderWorkspace(name) {

  const ws = workspaces[name];

  const left = document.getElementById("left");
  const right = document.getElementById("right");
  const center = document.getElementById("viewport");
  const bottom = document.getElementById("bottom");

  // unmount old
  Object.values(active).flat().forEach(c => c.unmount());

  left.innerHTML = "";
  right.innerHTML = "";
  center.innerHTML = "";
  bottom.innerHTML = "";

  active.left = ws.left();
  active.center = ws.center();
  active.right = ws.right();

  active.left.forEach(c => c.mount(left));
  active.center.forEach(c => c.mount(center));
  active.right.forEach(c => c.mount(right));

}

/* =======================================================
   WORKSPACE SWITCHER UI
======================================================= */

function renderSwitcher() {

  const el = document.getElementById("ws");

  Object.keys(workspaces).forEach(k => {

    const b = document.createElement("button");

    b.className = "btn " + (k === state.workspace ? "active" : "");
    b.textContent = k[0].toUpperCase();

    b.onclick = () => {
      state.workspace = k;
      renderSwitcher();
      renderWorkspace(k);
    };

    el.appendChild(b);
  });
}

/* =======================================================
   EVENTS
======================================================= */

bus.on("selection.changed", (s) => {
  // future: cross-panel sync already enabled
  console.log("selection:", s);
});

/* =======================================================
   INIT
======================================================= */

renderSwitcher();
renderWorkspace("runtime");

</script>

</body>
</html>
