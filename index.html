<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Driven Financial Simulation</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('finsim.displaySettings.v1') || '{}');
      document.documentElement.dataset.theme = (['dark','light','amber'].includes(s.theme)) ? s.theme : 'dark';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-left">
      <div class="logo-mark">⬡</div>
      <div>
        <div class="app-title">FinSim</div>
        <div class="app-subtitle">Event Driven Financial Simulation</div>
      </div>
    </div>
    <div class="header-center">
      <div class="sim-status-row">
        <div class="status-dot stopped" id="statusDot"></div>
        <span id="simStatus">STOPPED</span>
      </div>

      <!-- ── Time controls ─────────────────────────────────────────────────────────── -->
      <div class="time-controls">
        <button class="btn btn-warn btn-sm" id="resetBtn"     title="Reset to start">↩</button>
        <button class="btn" id="stepBackward" title="Step backward">←</button>
        <button class="btn btn-primary" id="playPause"    title="Play / Pause">▶</button>
        <button class="btn" id="stepForward"  title="Step forward">→</button>
        <div class="time-controls-slider-wrapper" id="sliderWrapper">
          <input class="time-controls-slider" id="timeSlider" type="range" min="0" max="100" value="0">
        </div>
        <span class="time-control-label" id="timeLabel">2026-01-01</span>
        <select id="tzSelect" class="toolbar-select" title="Date display timezone">
          <option value="utc">UTC</option>
          <option value="local">Local</option>
        </select>
        <select id="displayCurrency" class="toolbar-select" title="Display currency">
          <option value="USD">USD</option>
          <option value="AUD">AUD</option>
        </select>
        <select id="themeSelect" class="toolbar-select" title="Color theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="amber">Amber</option>
        </select>
      </div>
    </div>
    <div class="header-right">
      <div class="header-templates">
        <select id="workbenchTemplate" class="wb-select" title="Workspace layout template"></select>
        <button class="btn btn-sm" id="btnSaveTemplate"   title="Save current layout as template">Save</button>
        <button class="btn btn-sm" id="btnDeleteTemplate" title="Delete selected template">Del</button>
      </div>
      <span class="panel-tag">v1.0</span>
      <button class="btn btn-sm" id="btnHelp" title="Open help documentation">? HELP</button>
    </div>
  </header>
  <div id="workbench-root" style="flex:1;min-height:0;overflow:hidden"></div>
  <!-- ══ STATUS BAR ══════════════════════════════════════════ -->
  <div id="statusBar">
    <span>FinSim</span>
    <span>·</span>
    <span>Financial Simulation Framework</span>
    <span>·</span>
    <span id="footerPageTitle">Simulation Workbench</span>
  </div>
</div>

<!-- ══ TEMPLATES  ══════════════════════════════════════════ -->

<!-- NODE TEMPLATES -->
<template id="tpl-empty">
  <div class="tl-empty">Select a node</div>
</template>

<!-- ── EVENT TEMPLATES ───────────────────────── -->
<template id="tpl-event-editor">
  <div data-event-editor>
    <div class="node">
      <div class="node-header">
        <span>EVENT</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Event Type</label>
          <select data-id="type"></select>
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>Color</label>
          <input type="color" data-field="color" value="#888888" />
        </div>
        <div class="node-field">
          <label>Enabled</label>
          <input class="field-checkbox" type="checkbox" data-field="enabled" checked />
        </div>
      </div>
      <div class="node-field">
        <label>
          Handlers
          <span class="reducer-sel-count" id="event-handler-count"></span>
        </label>
        <div id="event-handlers"></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-event-series-editor">
  <div data-event-series-editor>
    <div class="node-field">
      <label>Interval</label>
      <select data-field="interval"></select>
    </div>
    <div class="node-field">
      <label>Start Offset</label>
      <input type="number" data-field="startOffset" min="0" value="0" />
    </div>
  </div>
</template>

<template id="tpl-event-one-off-editor">
  <div data-event-one-off-editor>
    <div class="node-field">
      <label>Date</label>
      <input data-field="date" type="date" />
    </div>
  </div>
</template>

<!-- ── HANDLER TEMPLATES ───────────────────────── -->
<template id="tpl-handler-editor">
  <div data-handler-editor>
    <div class="node">
      <div class="node-header">
        <span>HANDLER</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Handler Type</label>
          <select data-id="handlerClass"></select>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>
            Events
            <span class="reducer-sel-count" id="handler-event-count"></span>
          </label>
          <div id="handler-events"></div>
        </div>
        <div class="node-field">
          <label>
            Actions
            <span class="reducer-sel-count" id="handler-action-count"></span>
          </label>
          <div id="handler-actions"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ── ACTION TEMPLATES ───────────────────────── -->
<template id="tpl-action-editor">
  <div data-action-editor>
    <div class="node">
      <div class="node-header">
        <span>ACTION</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Action Class</label>
          <select data-id="actionClass"></select>
        </div>
        <div class="node-field">
          <label>Type (Discriminator)</label>
          <input data-id="type" placeholder="e.g. RECORD_METRIC" />
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>
            Handled By
            <span class="reducer-sel-count" id="action-handler-count"></span>
          </label>
          <div id="action-handlers"></div>
        </div>
        <div class="node-field">
          <label>
            Reduced By
            <span class="reducer-sel-count" id="action-reducer-count"></span>
          </label>
          <div id="action-reducers"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- AmountAction config: editable type discriminator + numeric amount -->
<template id="tpl-amount-action-editor">
  <div data-amount-action-editor>
    <div class="node-field">
      <label>Field name</label>
      <input type="text" disabled data-field="fieldName" value="amount" />
    </div>
    <div class="node-field">
      <label>Amount</label>
      <input type="number" data-field="value" value="0" />
    </div>
  </div>
</template>

<!-- FieldValueAction config: editable type + field name + value -->
<template id="tpl-field-action-editor">
  <div data-field-action-editor>
    <div class="node-field">
      <label>Field Name</label>
      <input data-field="fieldName" placeholder="e.g. salary" />
    </div>
  </div>
</template>

<!-- FieldValueAction config: editable type + field name + value -->
<template id="tpl-field-value-action-editor">
  <div data-field-value-action-editor>
    <div class="node-field">
      <label>Field Name</label>
      <input data-field="fieldName" placeholder="e.g. salary" />
    </div>
    <div class="node-field">
      <label>Fixed value <small style="font-weight:normal;opacity:.7">(leave blank to use value from state)</small></label>
      <input type="number" data-field="value" placeholder="auto">
    </div>
  </div>
</template>

<!-- ScriptedAction: target state field + JS script body that computes value -->
<!-- Script signature: stateClone, {
          date: this.currentDate,
          sourceEvent,
          handlerContext, me
        } => value                                -->
<template id="tpl-scripted-action-editor">
  <div data-scripted-action-editor>
    <div class="node-field">
      <label>Target field (optional)</label>
      <input data-field="fieldName" placeholder="e.g. salary or leave blank">
    </div>
    <div class="node-field">
      <label>Script <small style="font-weight:normal;opacity:.7">(state, {date, sourceEvent, handlerContext, me})</small></label>
      <textarea data-field="script" rows="6"
                style="width:100%;box-sizing:border-box;font-family:monospace;font-size:11px;resize:vertical"
                placeholder="// Set my value to 4&#10;me.value = 4; "></textarea>
    </div>
    <button class="btn btn-sm script-validate-button">Test</button>
    <pre class="code-test-result" style="display:none"></pre>
  </div>
</template>

<!-- ── REDUCER TEMPLATES ───────────────────────── -->
<template id="tpl-reducer-editor">
  <div data-reducer-editor>
    <div class="node">
      <div class="node-header">
        <span>REDUCER</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Reducer Type</label>
          <select data-id="type"></select>
        </div>
        <div class="node-field">
          <label>Priority</label>
          <select data-id="priority"></select>
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>
            Reduced Actions
            <span class="reducer-sel-count" id="reducer-reduced-actions-count"></span>
          </label>
          <div class="reducer-chip-grid" id="reducer-reduced-actions"></div>
        </div>
        <div class="node-field">
          <label>
            Generated Actions
            <span class="reducer-sel-count" id="reducer-generated-actions-count"></span>
          </label>
          <div id="reducer-generated-actions"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-account-transaction-reducer-editor">
  <div data-account-transaction-reducer-editor>
    <div class="node-field">
      <label>Account Key</label>
      <input data-field="accountKey">
    </div>
  </div>
</template>

<template id="tpl-field-reducer-editor">
  <div data-field-reducer-editor>
    <div class="node-field">
      <label>State field</label>
      <input data-field="fieldName">
    </div>
  </div>
</template>

<template id="tpl-field-value-reducer-editor">
  <div data-field-value-reducer-editor>
    <div class="node-field">
      <label>State field</label>
      <input data-field="fieldName">
    </div>
    <div class="node-field">
      <label>Fixed value <small style="font-weight:normal;opacity:.7">(leave blank to use action/state value)</small></label>
      <input type="number" data-field="value" placeholder="auto">
    </div>
  </div>
</template>

<!-- ScriptedReducer: optional target field + JS script body -->
<!-- Script signature (fieldName set):  (state, action, date) => value        -->
<!-- Script signature (no fieldName):   (state, action, date) => partialState -->
<template id="tpl-scripted-reducer-editor">
  <div data-scripted-reducer-editor>
    <div class="node-field">
      <label>Target field (optional)</label>
      <input data-field="fieldName" placeholder="e.g. salary or leave blank for full patch">
    </div>
    <div class="node-field">
      <label>Script <small style="font-weight:normal;opacity:.7">(state, action, date) =&gt; value | partialState</small></label>
      <textarea data-field="script" rows="8"
                style="width:100%;box-sizing:border-box;font-family:monospace;font-size:11px;resize:vertical"
                placeholder="// return value (if Target field set) or a partial state object&#10;return {};"></textarea>
    </div>
    <button class="btn btn-sm script-validate-button">Test</button>
    <pre class="code-test-result" style="display:none"></pre>
  </div>
</template>

<!-- VIEW ACTION TEMPLATE -->
<template id="tpl-action-template">
  <div data-action class="action-detail">
    <!-- Overview -->
    <div class="ad-section-header">Action</div>
    <div class="data-grid data-grid-2 ad-overview-grid">
      <div class="data-row">
        <label>Name</label>
        <span class="ad-node-row">
          <span data-id="action-name"></span>
          <span class="ad-type-badge" data-id="action-type"></span>
          <button class="ad-node-btn" data-action-btn="open-action" title="Open in editor" style="display:none">↗</button>
        </span>
      </div>
      <div class="data-row">
        <label>Date</label>
        <span data-id="entry-date"></span>
      </div>
      <div class="data-row">
        <label>Event</label>
        <span data-id="event-name"></span>
      </div>
      <div class="data-row">
        <label>Parent</label>
        <span data-id="parent-info"></span>
      </div>
      <div class="data-row">
        <label>Reducer</label>
        <span class="ad-node-row">
          <span data-id="reducer-name"></span>
          <button class="ad-node-btn" data-action-btn="open-reducer" title="Open in editor" style="display:none">↗</button>
        </span>
      </div>
      <div class="data-row">
        <label>Emitted</label>
        <span data-id="emitted"></span>
      </div>
    </div>
    <!-- Payload (collapsible) -->
    <div class="ad-collapse-header" data-collapse-toggle>
      <span class="ad-section-label">Payload</span>
      <span class="ad-collapse-icon">▶</span>
    </div>
    <div data-collapse-content style="display:none;padding:0 10px 6px">
      <pre class="field-code" data-id="action-payload" style="max-height:200px"></pre>
    </div>
    <!-- State changes (replaced by JS) -->
    <div data-state-change-grid></div>
  </div>
</template>

<!-- NODE STATE CHANGES TEMPLATE -->
<template id="tpl-node-state-changes">
  <div data-node-state-changes>
    <div id="node-state-changes">
      <div class="data-section-title">State Changes</div>
      <div class="data-grid data-grid-2" data-state-change-grid>
        <div class="data-row data-row-header" data-state-change-field-row style="display:none">
          <span class="diff-label">Field</span>
          <span class="diff-field" data-id="field"></span>
        </div>
        <div class="data-row" data-state-change-before-row style="display:none">
          <span class="diff-label">Before</span>
          <span class="diff-before" data-id="before"></span>
        </div>
        <div class="data-row" data-state-change-after-row style="display:none">
          <span class="diff-label">After</span>
          <span class="diff-after" data-id="after"></span>
        </div>
        <div class="data-row" data-id="noChangeRow" style="display:none">
          <label class="single-row" data-id="noChangeTitle" >(No Change - Previous State)</label>
          <pre class="field-code single-row" data-id="noChangeState"></pre>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- STATE DETAILS TEMPLATE -->
<template id="tpl-state-details">
  <div class="data-grid data-grid-2" data-stat-grid>
    <div class="data-row-header"><span>NAME</span><span>VALUE</span></div>
    <div class="data-row" data-stat-row style="display:none">
      <span class="stat-label"></span>
      <span class="stat-value"></span>
    </div>
  </div>
</template>

<!-- NODE DETAILS TEMPLATE -->
<template id="tpl-node-details">
  <div class="g-node" data-node-details>
    <div class="g-header">
      <span class="g-header-text"></span>
      <span class="node-state-badge badge-amber" data-id="stateChangeIndicator" style="display:none">Change</span>
      <span class="node-fired-badge badge-green" data-id="firedIndicator"></span>
      <span class="node-breakpoint-badge badge-red" data-id="breakpointIndicator" style="display:none" title="Breakpoint — right-click to remove">⏸</span>
    </div>
    <div class="g-title">
      <span class="g-title-text"></span>
    </div>

    <div class="g-port in"></div>
    <div class="g-port out"></div>
  </div>
</template>

<!-- TIME SLIDER TEMPLATE -->
<template id="tpl-time-control-slider-overlay">
  <div class="time-controls-slider-overlay">
    Busy...
  </div>
</template>
<template id="tpl-timeline-filter-bar">
  <div class = "tl-filter-bar">
    <div class="tl-filter-group">
      <label class="tl-filter-label" for="tl-ev-select">Event</label>
      <div class="reducer-chip-grid" id="tl-ev-select"></div>
    </div>
    <div class="tl-filter-group">
      <label class="tl-filter-label" for="tl-act-select">Action</label>
      <div class="reducer-chip-grid" id="tl-act-select"></div>
    </div>
    <div class="tl-filter-group tl-date-slider-group">
      <label class="tl-filter-label">Date Range</label>
      <div class="tl-date-slider-labels">
        <span id="tl-date-label-start" class="tl-date-slider-label-val"></span>
        <span id="tl-date-label-end"   class="tl-date-slider-label-val"></span>
      </div>
      <div class="tl-date-slider-wrap">
        <input type="range" id="tl-date-start" class="tl-date-slider" min="0" max="100" value="0"   disabled>
        <input type="range" id="tl-date-end"   class="tl-date-slider" min="0" max="100" value="100" disabled>
      </div>
    </div>
    <button class="btn btn-sm"    id="tl-filter-clear"    title="Clear all filters">✕</button>
    <button class="btn btn-sm"   id="tl-download-csv"   title="Download visible rows as CSV">⬇ CSV</button>
  </div>
</template>

<!-- ── PERSON EDITOR TEMPLATE ───────────────────────── -->
<template id="tpl-person-editor">
  <div data-person-editor>
    <div class="node">
      <div class="node-header"><span>PERSON</span></div>
      <div class="node-body">
        <div class="node-field">
          <label>Name</label>
          <input data-id="name" placeholder="e.g. Alice"/>
        </div>
        <div class="node-field">
          <label>Birth Date</label>
          <input type="date" data-id="birthDate"/>
        </div>
        <div class="node-field">
          <label>Citizen</label>
          <select data-id="citizen" multiple style="flex:1;height:52px">
            <option value="US">US</option>
            <option value="AUS">AUS</option>
          </select>
        </div>
        <div class="node-field">
          <label>US State</label>
          <!-- Optional sub-jurisdiction of residency='US' (design 34). Blank = no
               state of residency (e.g. a military base, or a non-US resident) ⇒ no
               state income tax. Options are filled in by PersonEditor from
               US_STATES (finance/tax/state/us-states.js) — the one list of
               modelled states — so this select stays empty here. -->
          <select data-id="residencyState" title="US state of residency, for state income tax. Leave blank when there is no state of residency (e.g. stationed on a military base, or living outside the US) — a blank state means no state income tax. The household's active state is the primary person's (design 34)."></select>
        </div>
        <div class="node-field">
          <label>Life Exp.</label>
          <input type="number" data-id="lifeExpectancy" value="90"/>
        </div>
        <div class="node-field">
          <label>SS /mo</label>
          <input type="number" data-id="socialSecurityMonthly" value="2800"/>
        </div>
        <div class="node-field">
          <label>SS Currency</label>
          <select data-id="ssCurrency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Wage /mo</label>
          <input type="number" data-id="monthlyWage" value="0" min="0"/>
        </div>
        <div class="node-field">
          <label>Self-employed</label>
          <input type="checkbox" data-id="selfEmployed" title="Treat monthly wage as self-employment income (sole trader / 1099). Incurs US self-employment tax (SECA)."/>
        </div>
        <div class="node-field">
          <label>Wage Currency</label>
          <select data-id="wageCurrency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Work Country</label>
          <select data-id="workCountry" title="Country where the work is actually performed. This — not the wage currency — determines whether the income is US- or AU-sourced for tax purposes. Leave as 'Same as residency' unless modelling a cross-border commuter or a remote worker paid from abroad.">
            <option value="">Same as residency</option>
            <option value="US">US</option>
            <option value="AU">AU</option>
          </select>
        </div>
        <div class="node-field">
          <label>Retire Date</label>
          <input type="date" data-id="retirementDate"/>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>

<!-- ── ACCOUNT EDITOR TEMPLATE ───────────────────────── -->
<template id="tpl-account-editor">
  <div data-account-editor>
    <div class="node">
      <div class="node-header"><span>ACCOUNT</span></div>
      <div class="node-body">
        <div class="node-field">
          <label>Name</label>
          <input data-id="name" placeholder="e.g. Primary Checking"/>
        </div>
        <div class="node-field">
          <label>Type</label>
          <select data-id="type">
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
            <option value="brokerage">Brokerage</option>
            <option value="401k">401(k)</option>
            <option value="roth">Roth IRA</option>
            <option value="ira">Traditional IRA</option>
            <option value="super">Superannuation</option>
            <option value="offset">Offset</option>
            <option value="loan">Loan (liability)</option>
          </select>
        </div>
        <div class="node-field">

        </div>
        <div class="node-field">
          <label>Currency</label>
          <select data-id="currency">
            <option value="USD">USD</option>

        </div>
        <div class="node-field">

        <div class="node-field" data-id="cashRateRow" style="display:none">

          <input type="number" step="0.001" data-id="cashRate" placeholder="blank = default"

        <div class="node-field" data-id="transactionAccountRow" style="display:none">

        </div>
        <!-- §988 currency basis (design 87). Shown only for a NON-USD cash account:
             §988(c)(1)(C)(ii) makes any foreign-currency bank deposit nonfunctional
             currency, so savings/transaction/offset all qualify, and USD never does
             (it is the taxpayer's functional currency, §985(b)(1)). -->
        <div data-id="fxBasisFields" style="display:none">
          <div class="node-field">
            <label>§988 FX Basis</label>
            <input type="number" step="0.0001" data-id="fxBasisRate" placeholder="blank = rate at first disposition"
                   title="Foreign units per USD at which this pool's currency was ACQUIRED (design 87). Spending foreign cash is a disposition of nonfunctional currency and realizes ordinary exchange gain or loss against this rate. For a balance built up over years this is the balance-weighted average of the rates it was acquired at — AUD earned in Australia takes the spot rate on the day earned, so a long-accumulated pool is NOT today's rate. Blank stamps the rate at the first disposition, which UNDERSTATES §988 rather than inventing it."/>
            <div class="field-hint" data-id="fxBasisHint" style="font-size:0.8em;opacity:0.7"></div>

          <div class="node-field">

                   title="Share of this pool put to an income-producing use (0–1). Drives two tests at once: §988(e)(3) (expenses meeting §162/§212 — whether §988 applies at all) and §165(c)(2) (a loss must be from a transaction &quot;entered into for profit&quot; to be deductible). &quot;For profit&quot; is the broader test, so one knob over-disallows rather than over-deducts. A personal currency loss is disallowed while the matching gain is still taxed. Blank = fully personal, the safe default — an offset backing a rental should be set explicitly."/>
          </div>
        </div>
        <div class="node-field" data-id="drawdownRow">
          <label>Drawdown</label>
          <input type="number" data-id="drawdownPriority" placeholder="blank = exclude"/>
        </div>
        <div data-id="investmentFields" style="display:none">

            <label>Contribution Basis</label>

          </div>
          <div class="node-field">
            <label>Earnings Basis</label>
            <input type="number" data-id="earningsBasis" value="0" disabled title="Computed = balance − contributions"/>
          </div>
        </div>
        <div data-id="offsetFields" style="display:none">
          <div class="node-field">
            <label>Offsets Property</label>
            <select data-id="offsetsPropertyKey">
              <option value="">— none —</option>
            </select>
          </div>
        </div>
        <!-- ── LOAN (liability) — design 54 §2 + design 86 terms/deductibility ──
             `balance` is the outstanding principal as a POSITIVE number; net worth
             subtracts it. A loan is never a drawdown source, so the Drawdown row is
             hidden for this type. -->
        <div data-id="loanFields" style="display:none">
          <div class="node-section-head">Loan Terms (design 54 / 86)</div>
          <div class="node-field">
            <label>Interest Rate</label>
            <input type="number" step="0.001" data-id="loanRate" value="0"
                   title="Annual rate the lender quotes (absolute, e.g. 0.06 = 6%). When Prime is configured it is stored as a spread over the central-bank Prime rate, so a Prime move re-rates this loan (design 56)."/>
            <div class="field-hint" data-id="loanRateHint" style="font-size:0.8em;opacity:0.7"></div>
          </div>
          <div class="node-field">
            <label>Monthly Payment</label>
            <input type="number" data-id="monthlyPayment" value="0"
                   title="Fixed monthly P&amp;I payment. Inert while Interest Only is on (the payment is derived from the accrued interest) and after IO expiry with a maturity year set (the loan re-amortises over the remaining term). A fixed payment below the accrued interest does not error — the balance grows."/>
          </div>
          <div class="node-field">
            <label>Interest Only</label>
            <input type="checkbox" data-id="interestOnly"
                   title="Pay exactly the accrued interest on the effective (offset-reduced) principal each month, so the balance is flat by construction and a variable rate is tracked automatically (design 86 G2)."/>
          </div>
          <div class="node-field">
            <label>IO Until Year</label>
            <input type="number" data-id="interestOnlyUntilYear" placeholder="blank = IO for life"
                   title="Calendar year the interest-only period ends; from then the loan reverts to P&amp;I amortised over the remaining term (needs a Maturity Year). Blank = interest-only forever (design 86 G6)."/>
          </div>
          <div class="node-field">
            <label>Maturity Year</label>
            <input type="number" data-id="maturityYear" placeholder="blank = no term"
                   title="Calendar year the loan must be discharged — the whole remaining balance plus interest is paid that year. Blank = no term (design 86 G6)."/>
            <div class="field-hint" data-id="loanTermHint" style="font-size:0.8em;opacity:0.7"></div>
          </div>
          <div class="node-field">
            <label>Deductible Frac.</label>
            <input type="number" step="0.05" min="0" max="1" data-id="deductibleFraction" placeholder="blank = auto (rental)"
                   title="Income-producing share of the borrowed money's USE, 0..1 (s8-1; Munro; TR 95/33) — design 86 G3. Blank keeps the default rule: fully deductible while a linked property rents, nil otherwise. It also sets the §988(e) business share. On a STANDALONE loan (no linked property) a stated fraction deducts the interest paid: in full against AU assessable income (s8-1), and on the US return only up to net investment income, with the excess carried forward (§163(d))."/>
          </div>
          <div class="node-field">
            <label>Linked Property</label>
            <select data-id="linkedPropertyKey"
                    title="The property this loan finances. Only properties with no mortgage balance of their own are offered: a property with one already synthesizes its own &lt;property&gt;Loan, and a second loan against it would double-count the debt. The link is also what joins an offset account to this loan.">
              <option value="">— none (standalone) —</option>
            </select>
          </div>
          <div class="node-field">
            <label>Payment Source</label>
            <select data-id="paymentSourceKey"
                    title="Account the monthly payment is debited from. Blank resolves in order: a same-currency offset linked to this loan's property, then the country's flagged transaction account, then its savings pool.">
              <option value="">— default —</option>
            </select>
          </div>
          <div class="node-field">
            <label>§988 Booking FX</label>
            <input type="number" step="0.0001" data-id="bookingFxRate" placeholder="blank = rate at first payment"
                   title="Foreign units per USD on the date the debt was incurred (design 86 G7). A non-USD loan held by a US person realizes ordinary exchange gain or loss on each principal repayment, measured against this rate. Blank stamps the rate at the first payment, which UNDERSTATES §988 for a loan already outstanding at t0."/>
          </div>
        </div>
        <div data-id="holdingsSection" class="holdings-section" style="display:none">
          <div class="holdings-header">
            <span>Holdings</span>
            <button class="btn btn-xs" data-id="addHoldingBtn" type="button">+ Add</button>
            <button class="btn btn-xs" data-id="ladderBtn" type="button" title="Build a bond ladder — expands into N staggered individual bonds (design 66 §G8)">+ Bond ladder</button>
          </div>
          <!-- Bond-ladder builder (design 66 §G8). Expands (total, rungs, spacing,
               term, tax, coupon, roll, zero/TIPS) into N staggered BOND rungs that
               self-perpetuate via roll-to-tail. Hidden until "+ Bond ladder". -->
          <div data-id="ladderBuilder" class="ladder-builder" style="display:none">
            <label>Total <input class="ladder-input" data-lf="total" type="number" min="0" placeholder="Total $"/></label>
            <label>Rungs <input class="ladder-input" data-lf="rungs" type="number" min="2" max="30" value="5" style="width:4em"/></label>
            <label>Spacing (yr) <input class="ladder-input" data-lf="spacing" type="number" min="1" step="0.5" value="1" style="width:4em"/></label>
            <label>First rung (yr) <input class="ladder-input" data-lf="firstTerm" type="number" min="0" step="0.5" value="1" style="width:4em"/></label>
            <label>Tax
              <select class="ladder-input" data-lf="taxExemption">
                <option value="none">Taxable</option>
                <option value="state">Treasury</option>
                <option value="federal">Municipal</option>
                <option value="both">Muni (all-state)</option>
              </select>
            </label>
            <label>Coupon <input class="ladder-input" data-lf="couponRate" type="number" step="0.001" placeholder="market" style="width:5em"/></label>
            <label title="Coupon frequency — payments per year (design 66 §G10a)">Freq
              <select class="ladder-input" data-lf="couponFrequency">
                <option value="1">Annual</option>
                <option value="2" selected>Semi-ann.</option>
                <option value="4">Quarterly</option>
              </select>
            </label>
            <label title="Roll each maturing rung into a fresh bond at the ladder's full term — a self-perpetuating ladder (design 66 §G8). Off ⇒ rungs fall to cash as they mature (spend-down)."><input class="ladder-input" data-lf="roll" type="checkbox" checked/> Roll</label>
            <label title="Zero-coupon / OID ladder"><input class="ladder-input" data-lf="zeroCoupon" type="checkbox"/> Zero</label>
            <label title="TIPS / inflation-linked ladder"><input class="ladder-input" data-lf="inflationLinked" type="checkbox"/> TIPS</label>
            <button class="btn btn-xs btn-primary" data-id="ladderBuildBtn" type="button">Build</button>
            <button class="btn btn-xs" data-id="ladderCancelBtn" type="button">Cancel</button>
          </div>
          <table class="holdings-table">
            <thead>
              <tr>
                <th class="h-expand-col" aria-hidden="true"></th>
                <th>Label</th>
                <th>Allocation</th>
                <th>Rate Key</th>
                <th class="num">Market Value</th>
                <th></th>
              </tr>
            </thead>
            <tbody data-id="holdingsTbody"></tbody>
          </table>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm" data-id="historyBtn" style="display:none">History</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>

<!-- ── REAL PROPERTY EDITOR TEMPLATE ─────────────────── -->
<template id="tpl-real-property-editor">
  <div data-real-property-editor>
    <div class="node">
      <div class="node-header"><span>REAL PROPERTY</span></div>
      <div class="node-body">
        <div class="node-field">
          <label>Name</label>
          <input data-id="name" placeholder="e.g. Primary Residence"/>
        </div>
        <div class="node-field">
          <label>Country</label>
          <select data-id="country">
            <option value="US">US</option>
            <option value="AU">AU</option>
          </select>
        </div>
        <div class="node-field">
          <label>Currency</label>
          <select data-id="currency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Value</label>
          <input type="number" data-id="value" value="0"/>
        </div>
        <div class="node-field">
          <label>Cost Basis</label>
          <input type="number" data-id="costBasis" value="0"/>
        </div>
        <div class="node-field">
          <label>Apprec. Rate</label>
          <input type="number" data-id="appreciationRate" value="0.035" step="0.001"/>
        </div>
        <div class="node-field">
          <label>Sale Year</label>
          <input type="number" data-id="plannedSaleYear" placeholder="blank = none"/>
        </div>
        <div class="node-field">
          <label>Sale Acct.</label>
          <select data-id="saleDestinationAccount">
            <option value="">— none —</option>
          </select>
        </div>
        <div class="node-field">
          <label>Ownership</label>
          <select data-id="ownershipType">
            <option value="sole">Sole</option>
            <option value="joint">Joint</option>
          </select>
        </div>
        <div class="node-field">
          <label>Owner</label>
          <select data-id="ownerId">
            <option value="">— none —</option>
          </select>
        </div>
        <!-- ── PURCHASE — buying this dwelling part-way through the run. A property
             with a future purchase year sits DORMANT at value 0 until then (running
             costs skip a zero-value property and appreciation on 0 is 0), so this is
             how a downsize is authored: sell one dwelling, buy another. ── -->
        <div class="node-section-head">Purchase (buy mid-run)</div>
        <div class="node-field">
          <label>Purchase Year</label>
          <input type="number" data-id="purchaseYear" placeholder="blank = owned from the start"
                 title="Calendar year this dwelling is bought. Blank = already owned at the simulation start (today's behaviour). Set it and the property is DORMANT — worth nothing, costing nothing — until 15 January of that year, when the price is debited and it becomes an ordinary property. The purchase settles AFTER any sale on the same date, so selling and buying in one January works."/>
        </div>
        <div class="node-field">
          <label>Purchase Price</label>
          <input type="number" data-id="purchasePrice" placeholder="blank = no purchase"
                 title="What the dwelling costs, in TODAY's money, in the property's currency. It is grown to the purchase date at this property's own appreciation rate — not CPI — so a price set as a share of what you are selling keeps that share. A purchase year with no price buys nothing."/>
        </div>
        <div class="node-field">
          <label>Price Is Nominal</label>
          <input type="checkbox" data-id="purchasePriceIsNominal"
                 title="Tick when the price is already stated as at the purchase date (a contracted price). Unticked — the default — treats it as today's money and grows it."/>
        </div>
        <div class="node-field">
          <label>Fund From</label>
          <select data-id="purchaseFundFrom"
                  title="Account the purchase price is debited from. Blank uses the property country's cash pool. If the balance would breach its minimum, the shortfall is raised through the normal drawdown queue — which is what makes a purchase interact with the portfolio instead of looking free.">
            <option value="">— country cash pool —</option>
          </select>
        </div>

        <!-- ── MAIN RESIDENCE HISTORY — design 83 G7. The static Primary Res. checkbox
             above can only say "throughout" or "never"; these dates say WHEN, which is
             what s118-185, §121(b)(5) and s115-115 all turn on. ── -->
        <div class="node-section-head">Main Residence History (design 83 G7)</div>
        <div class="node-field">
          <label>Acquired</label>
          <input type="date" data-id="acquisitionDate"
                 title="When the dwelling was actually bought. This is the denominator of the AU s118-185 ownership period AND of the s115-105 CGT discount testing period, and the start of the US §121 nonqualified-use window. LEAVE IT BLANK AND THOSE CONCESSIONS ARE DENIED — it is not defaulted to the simulation start, because that would treat a twenty-year hold as a three-year one and inflate every fraction in your favour. Set automatically when a dwelling is bought mid-run."/>
        </div>
        <!-- One dropdown plus a conditional date, rather than free-form dates that can
             be set to contradictory combinations (design 83 §7b.2c). The four options
             are the only histories the rules distinguish, and each shows exactly the
             one date it needs — so "moved out before you moved in" is unreachable
             rather than merely invalid. -->
        <div class="node-field">
          <label>History</label>
          <select data-id="mainResidenceMode"
                  title="Which main-residence history this dwelling has. NEVER = an investment property throughout (no AU exemption, no US §121). THROUGHOUT = the main residence for the whole hold (fully exempt in AU, full §121 cap in the US). The two mixed options each prorate — Australia by the fraction of ownership days, the United States by §121(b)(5) nonqualified use — and the ORDER matters: renting after you move out is forgiven by §121 Exception 1, renting before you move in is not.">
            <option value="never">Never a main residence</option>
            <option value="throughout">Main residence throughout</option>
            <option value="moved-out">From the start, then moved out</option>
            <option value="moved-in">Became one later</option>
          </select>
        </div>
        <div class="node-field" data-id="mainResidenceMovedInRow">
          <label>Moved In</label>
          <input type="date" data-id="mainResidenceFrom"
                 title="When this dwelling first became the main residence. Australia exempts only the fraction of ownership days it WAS the main residence, so moving into a long-rented house late buys a small fraction — not the lot."/>
        </div>
        <div class="node-field" data-id="mainResidenceMovedOutRow">
          <label>Moved Out</label>
          <input type="date" data-id="mainResidenceUntil"
                 title="When it stopped being the main residence. Everything after this date is a rental period — which §121 Exception 1 forgives, unlike the years before you move in."/>
        </div>
        <div class="node-field">
          <label>Downsizer Contrib.</label>
          <input type="checkbox" data-id="claimDownsizerContribution"
                 title="Claim the AU s292-102 downsizer super contribution on this dwelling's sale: up to A$300,000 per owner aged 55+, outside the contribution caps, for an Australian dwelling held 10+ years. Requires the main-residence exemption to be at least PARTLY available — so a dwelling that was never lived in funds nothing, and this is the same lever as Main Res. From. Figures unverified against the ATO."/>
        </div>

        <!-- ── MORTGAGE — synthesized into a linked Loan liability at build time
             (design 54 P2); its terms and deductibility come from design 86. ── -->
        <div class="node-section-head">Mortgage (design 54 / 86)</div>
        <div class="node-field">
          <label>Mortgage Bal.</label>
          <input type="number" data-id="mortgageBalance" value="0" title="Outstanding principal, in the property's currency. Above 0 this synthesizes a linked Loan liability keyed &lt;property&gt;Loan; the property itself then contributes equity only."/>
        </div>
        <div class="node-field">
          <label>Monthly Mtg.</label>
          <input type="number" data-id="monthlyMortgage" value="0" title="Fixed monthly P&amp;I payment. Inert while Interest Only is on (the payment is derived from the accrued interest) and while past the IO expiry with a maturity year set (the loan re-amortises over the remaining term)."/>
        </div>
        <div class="node-field">
          <label>Mtg. Int. Rate</label>
          <input type="number" data-id="mortgageInterestRate" value="0" step="0.001" title="Annual mortgage interest rate the bank quotes (deductible). When Prime is configured it is stored as a spread over Prime (design 56), so a Prime move re-rates the loan."/>
          <div class="field-hint" data-id="mortgageRateHint" style="font-size:0.8em;opacity:0.7"></div>
        </div>
        <div class="node-field">
          <label>Interest Only</label>
          <input type="checkbox" data-id="mortgageInterestOnly" title="Pay exactly the accrued interest on the effective (offset-reduced) principal each month, so the balance is flat by construction and a variable rate is tracked automatically (design 86 G2). A fixed Monthly Mtg. below the accrued interest silently negatively amortizes instead — this is the safe way to express interest-only."/>
        </div>
        <div class="node-field">
          <label>IO Until Year</label>
          <input type="number" data-id="mortgageInterestOnlyUntilYear" placeholder="blank = IO for life" title="Calendar year the interest-only period ends. From that year the loan reverts to P&amp;I amortised over the REMAINING term (needs a Maturity Year), which is the payment step-up a 'hold the leverage' plan is exposed to. Blank = interest-only forever (design 86 G6)."/>
        </div>
        <div class="node-field">
          <label>Maturity Year</label>
          <input type="number" data-id="mortgageMaturityYear" placeholder="blank = no term" title="Calendar year the loan must be discharged. In that year the whole remaining balance plus interest is paid; a shortfall runs through the normal replenish / insufficient-funds path. Blank = no term, the loan amortises (or stays interest-only) forever (design 86 G6)."/>
          <div class="field-hint" data-id="mortgageTermHint" style="font-size:0.8em;opacity:0.7"></div>
        </div>
        <div class="node-field">
          <label>Deductible Frac.</label>
          <input type="number" data-id="mortgageDeductibleFraction" step="0.05" min="0" max="1" placeholder="blank = auto (rental)" title="Income-producing share of the borrowed money's USE, 0..1 (s8-1; Munro; TR 95/33) — design 86 G3. Blank keeps the default rule: fully deductible while the property is renting, nil otherwise. It also decides the §988(e) business share, so it moves the exchange gain/loss treatment too."/>
        </div>
        <div class="node-field">
          <label>§988 Booking FX</label>
          <input type="number" data-id="mortgageBookingFxRate" step="0.0001" placeholder="blank = rate at first payment" title="Foreign units per USD on the date the debt was incurred (design 86 G7). A non-USD mortgage held by a US person realizes ordinary exchange gain or loss on each principal repayment, measured against this rate. Blank stamps the rate at the first payment, which treats the loan as incurred then and so UNDERSTATES §988 for a loan already outstanding at t0."/>
        </div>

        <div class="node-section-head">Rental Income (design 48)</div>
        <div class="node-field">
          <label>Rental Income</label>
          <input type="checkbox" data-id="rentalEnabled"/>
        </div>
        <div class="node-field">
          <label>Monthly Rent</label>
          <input type="number" data-id="monthlyRent" value="0" title="Gross rent at 100% occupancy"/>
        </div>
        <div class="node-field">
          <label>Occupancy</label>
          <input type="number" data-id="occupancyRate" value="0.95" step="0.01" title="Fraction realized (LTR ≈ 0.95, STR ≈ 0.55)"/>
        </div>
        <div class="node-field">
          <label>Expense Ratio</label>
          <input type="number" data-id="rentalExpenseRatio" value="0.25" step="0.01" title="Deductible cash opex as a fraction of gross rent"/>
        </div>
        <div class="node-field">
          <label>Land Value %</label>
          <input type="number" data-id="landValueRatio" value="0.2" step="0.01" title="Non-depreciable land fraction of cost basis"/>
        </div>
        <div class="node-field">
          <label>Deprec. Override</label>
          <input type="number" data-id="annualDepreciationOverride" placeholder="blank = derive" title="Explicit annual depreciation $; blank derives per-country"/>
        </div>

        <!-- ── Owner-occupied HOLDING COST — separate from rental opex above (design 75) ── -->
        <div class="node-section-head">Running Costs &amp; Repairs (design 75)</div>
        <div class="node-field">
          <label>Annual Running Cost</label>
          <input type="number" data-id="annualRunningCost" value="0" title="Base-year fixed holding cost (rates + insurance + utilities + servicing) in the property's currency. Inflates each year. 0 = off."/>
        </div>
        <div class="node-field">
          <label>Running Cost % Val.</label>
          <input type="number" data-id="runningCostValuePct" value="0" step="0.001" title="Optional value-proportional running cost, as a fraction of current value per year (0.005 = 0.5%/yr). Added on top of the fixed cost. 0 = none."/>
        </div>
        <div class="node-field">
          <label>Running Cost Growth</label>
          <input type="number" data-id="runningCostGrowth" value="0" step="0.001" title="Optional REAL growth of the running cost on top of inflation (0 = tracks inflation exactly)."/>
        </div>
        <div class="node-field">
          <label>Repair Model</label>
          <select data-id="repairModel" title="Stochastic repair process. NONE = no repairs drawn. BERNOULLI = one big repair some years. POISSON = a variable count per year. CONTINUOUS = a lognormal cost every year.">
            <option value="NONE">None</option>
            <option value="BERNOULLI">Bernoulli (one big repair some years)</option>
            <option value="POISSON">Poisson (variable count / year)</option>
            <option value="CONTINUOUS">Continuous (every year)</option>
          </select>
        </div>
        <div class="node-field">
          <label>Repair Prob.</label>
          <input type="number" data-id="repairProb" value="0" step="0.01" title="Annual probability of a repair (BERNOULLI model), e.g. 0.25 ≈ a big repair every 4 years."/>
        </div>
        <div class="node-field">
          <label>Repair Rate λ</label>
          <input type="number" data-id="repairLambda" value="0" step="0.1" title="Expected number of repairs per year (POISSON model)."/>
        </div>
        <div class="node-field">
          <label>Repair Median</label>
          <input type="number" data-id="repairMedian" value="0" title="Median severity per repair event, in the property's currency. Ignored when Repair % Val. is set."/>
        </div>
        <div class="node-field">
          <label>Repair % Val.</label>
          <input type="number" data-id="repairValuePct" value="0" step="0.001" title="Alternative severity anchor: median repair = this fraction × current value (0.02 ≈ 2% of the house). Overrides Repair Median when > 0."/>
        </div>
        <div class="node-field">
          <label>Repair σ</label>
          <input type="number" data-id="repairSigma" value="0.6" step="0.05" title="Lognormal shape (tail heaviness) of repair severity. Higher ⇒ fatter tail of large repairs."/>
        </div>
        <div class="node-field">
          <label>Capitalize Frac.</label>
          <input type="number" data-id="capitalizeRepairs" value="0" step="0.05" title="Fraction of each repair treated as a capital improvement (lifts cost basis, cuts the eventual CGT). 0 = pure maintenance."/>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>
