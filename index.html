<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Driven Financial Simulation</title>
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('finsim.displaySettings.v1') || '{}');
      document.documentElement.dataset.theme = (['dark','light','amber'].includes(s.theme)) ? s.theme : 'dark';
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="header-left">
      <div class="logo-mark">⬡</div>
      <div>
        <div class="app-title">FinSim</div>
        <div class="app-subtitle">Event Driven Financial Simulation</div>
      </div>
    </div>
    <div class="header-center">
      <div class="sim-status-row">
        <div class="status-dot stopped" id="statusDot"></div>
        <span id="simStatus">STOPPED</span>
      </div>

      <!-- ── Time controls ─────────────────────────────────────────────────────────── -->
      <div class="time-controls">
        <button class="btn btn-warn btn-sm" id="resetBtn"     title="Reset to start">↩</button>
        <button class="btn" id="stepBackward" title="Step backward">←</button>
        <button class="btn btn-primary" id="playPause"    title="Play / Pause">▶</button>
        <button class="btn" id="stepForward"  title="Step forward">→</button>
        <div class="time-controls-slider-wrapper" id="sliderWrapper">
          <input class="time-controls-slider" id="timeSlider" type="range" min="0" max="100" value="0">
        </div>
        <span class="time-control-label" id="timeLabel">2026-01-01</span>
        <select id="tzSelect" class="toolbar-select" title="Date display timezone">
          <option value="utc">UTC</option>
          <option value="local">Local</option>
        </select>
        <select id="displayCurrency" class="toolbar-select" title="Display currency">
          <option value="USD">USD</option>
          <option value="AUD">AUD</option>
        </select>
        <select id="themeSelect" class="toolbar-select" title="Color theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="amber">Amber</option>
        </select>
      </div>
    </div>
    <div class="header-right">
      <div class="header-templates">
        <select id="workbenchTemplate" class="wb-select" title="Workspace layout template"></select>
        <button class="btn btn-sm" id="btnSaveTemplate"   title="Save current layout as template">Save</button>
        <button class="btn btn-sm" id="btnDeleteTemplate" title="Delete selected template">Del</button>
      </div>
      <span class="panel-tag">v1.0</span>
      <button class="btn btn-sm" id="btnHelp" title="Open help documentation">? HELP</button>
    </div>
  </header>
  <div id="workbench-root" style="flex:1;min-height:0;overflow:hidden"></div>
  <!-- ══ STATUS BAR ══════════════════════════════════════════ -->
  <div id="statusBar">
    <span>FinSim</span>
    <span>·</span>
    <span>Financial Simulation Framework</span>
    <span>·</span>
    <span id="footerPageTitle">Simulation Workbench</span>
  </div>
</div>

<!-- ══ TEMPLATES  ══════════════════════════════════════════ -->

<!-- NODE TEMPLATES -->
<template id="tpl-empty">
  <div class="tl-empty">Select a node</div>
</template>

<!-- ── EVENT TEMPLATES ───────────────────────── -->
<template id="tpl-event-editor">
  <div data-event-editor>
    <div class="node">
      <div class="node-header">
        <span>EVENT</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Event Type</label>
          <select data-id="type"></select>
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>Color</label>
          <input type="color" data-field="color" value="#888888" />
        </div>
        <div class="node-field">
          <label>Enabled</label>
          <input class="field-checkbox" type="checkbox" data-field="enabled" checked />
        </div>
      </div>
      <div class="node-field">
        <label>
          Handlers
          <span class="reducer-sel-count" id="event-handler-count"></span>
        </label>
        <div id="event-handlers"></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-event-series-editor">
  <div data-event-series-editor>
    <div class="node-field">
      <label>Interval</label>
      <select data-field="interval"></select>
    </div>
    <div class="node-field">
      <label>Start Offset</label>
      <input type="number" data-field="startOffset" min="0" value="0" />
    </div>
  </div>
</template>

<template id="tpl-event-one-off-editor">
  <div data-event-one-off-editor>
    <div class="node-field">
      <label>Date</label>
      <input data-field="date" type="date" />
    </div>
  </div>
</template>

<!-- ── HANDLER TEMPLATES ───────────────────────── -->
<template id="tpl-handler-editor">
  <div data-handler-editor>
    <div class="node">
      <div class="node-header">
        <span>HANDLER</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Handler Type</label>
          <select data-id="handlerClass"></select>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>
            Events
            <span class="reducer-sel-count" id="handler-event-count"></span>
          </label>
          <div id="handler-events"></div>
        </div>
        <div class="node-field">
          <label>
            Actions
            <span class="reducer-sel-count" id="handler-action-count"></span>
          </label>
          <div id="handler-actions"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ── ACTION TEMPLATES ───────────────────────── -->
<template id="tpl-action-editor">
  <div data-action-editor>
    <div class="node">
      <div class="node-header">
        <span>ACTION</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Action Class</label>
          <select data-id="actionClass"></select>
        </div>
        <div class="node-field">
          <label>Type (Discriminator)</label>
          <input data-id="type" placeholder="e.g. RECORD_METRIC" />
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>
            Handled By
            <span class="reducer-sel-count" id="action-handler-count"></span>
          </label>
          <div id="action-handlers"></div>
        </div>
        <div class="node-field">
          <label>
            Reduced By
            <span class="reducer-sel-count" id="action-reducer-count"></span>
          </label>
          <div id="action-reducers"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- AmountAction config: editable type discriminator + numeric amount -->
<template id="tpl-amount-action-editor">
  <div data-amount-action-editor>
    <div class="node-field">
      <label>Field name</label>
      <input type="text" disabled data-field="fieldName" value="amount" />
    </div>
    <div class="node-field">
      <label>Amount</label>
      <input type="number" data-field="value" value="0" />
    </div>
  </div>
</template>

<!-- FieldValueAction config: editable type + field name + value -->
<template id="tpl-field-action-editor">
  <div data-field-action-editor>
    <div class="node-field">
      <label>Field Name</label>
      <input data-field="fieldName" placeholder="e.g. salary" />
    </div>
  </div>
</template>

<!-- FieldValueAction config: editable type + field name + value -->
<template id="tpl-field-value-action-editor">
  <div data-field-value-action-editor>
    <div class="node-field">
      <label>Field Name</label>
      <input data-field="fieldName" placeholder="e.g. salary" />
    </div>
    <div class="node-field">
      <label>Fixed value <small style="font-weight:normal;opacity:.7">(leave blank to use value from state)</small></label>
      <input type="number" data-field="value" placeholder="auto">
    </div>
  </div>
</template>

<!-- ScriptedAction: target state field + JS script body that computes value -->
<!-- Script signature: stateClone, {
          date: this.currentDate,
          sourceEvent,
          handlerContext, me
        } => value                                -->
<template id="tpl-scripted-action-editor">
  <div data-scripted-action-editor>
    <div class="node-field">
      <label>Target field (optional)</label>
      <input data-field="fieldName" placeholder="e.g. salary or leave blank">
    </div>
    <div class="node-field">
      <label>Script <small style="font-weight:normal;opacity:.7">(state, {date, sourceEvent, handlerContext, me})</small></label>
      <textarea data-field="script" rows="6"
                style="width:100%;box-sizing:border-box;font-family:monospace;font-size:11px;resize:vertical"
                placeholder="// Set my value to 4&#10;me.value = 4; "></textarea>
    </div>
    <button class="btn btn-sm script-validate-button">Test</button>
    <pre class="code-test-result" style="display:none"></pre>
  </div>
</template>

<!-- ── REDUCER TEMPLATES ───────────────────────── -->
<template id="tpl-reducer-editor">
  <div data-reducer-editor>
    <div class="node">
      <div class="node-header">
        <span>REDUCER</span>
      </div>
      <div class="node-body">
        <div class="node-field">
          <label>Description</label>
          <span data-id="description"></span>
        </div>
        <div class="node-field">
          <label>Label</label>
          <input data-id="name"></input>
        </div>
        <div class="node-field">
          <label>Reducer Type</label>
          <select data-id="type"></select>
        </div>
        <div class="node-field">
          <label>Priority</label>
          <select data-id="priority"></select>
        </div>
        <div data-id="config"></div>
        <div class="node-field">
          <label>
            Reduced Actions
            <span class="reducer-sel-count" id="reducer-reduced-actions-count"></span>
          </label>
          <div class="reducer-chip-grid" id="reducer-reduced-actions"></div>
        </div>
        <div class="node-field">
          <label>
            Generated Actions
            <span class="reducer-sel-count" id="reducer-generated-actions-count"></span>
          </label>
          <div id="reducer-generated-actions"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-account-transaction-reducer-editor">
  <div data-account-transaction-reducer-editor>
    <div class="node-field">
      <label>Account Key</label>
      <input data-field="accountKey">
    </div>
  </div>
</template>

<template id="tpl-field-reducer-editor">
  <div data-field-reducer-editor>
    <div class="node-field">
      <label>State field</label>
      <input data-field="fieldName">
    </div>
  </div>
</template>

<template id="tpl-field-value-reducer-editor">
  <div data-field-value-reducer-editor>
    <div class="node-field">
      <label>State field</label>
      <input data-field="fieldName">
    </div>
    <div class="node-field">
      <label>Fixed value <small style="font-weight:normal;opacity:.7">(leave blank to use action/state value)</small></label>
      <input type="number" data-field="value" placeholder="auto">
    </div>
  </div>
</template>

<!-- ScriptedReducer: optional target field + JS script body -->
<!-- Script signature (fieldName set):  (state, action, date) => value        -->
<!-- Script signature (no fieldName):   (state, action, date) => partialState -->
<template id="tpl-scripted-reducer-editor">
  <div data-scripted-reducer-editor>
    <div class="node-field">
      <label>Target field (optional)</label>
      <input data-field="fieldName" placeholder="e.g. salary or leave blank for full patch">
    </div>
    <div class="node-field">
      <label>Script <small style="font-weight:normal;opacity:.7">(state, action, date) =&gt; value | partialState</small></label>
      <textarea data-field="script" rows="8"
                style="width:100%;box-sizing:border-box;font-family:monospace;font-size:11px;resize:vertical"
                placeholder="// return value (if Target field set) or a partial state object&#10;return {};"></textarea>
    </div>
    <button class="btn btn-sm script-validate-button">Test</button>
    <pre class="code-test-result" style="display:none"></pre>
  </div>
</template>

<!-- VIEW ACTION TEMPLATE -->
<template id="tpl-action-template">
  <div data-action class="action-detail">
    <!-- Overview -->
    <div class="ad-section-header">Action</div>
    <div class="data-grid data-grid-2 ad-overview-grid">
      <div class="data-row">
        <label>Name</label>
        <span class="ad-node-row">
          <span data-id="action-name"></span>
          <span class="ad-type-badge" data-id="action-type"></span>
          <button class="ad-node-btn" data-action-btn="open-action" title="Open in editor" style="display:none">↗</button>
        </span>
      </div>
      <div class="data-row">
        <label>Date</label>
        <span data-id="entry-date"></span>
      </div>
      <div class="data-row">
        <label>Event</label>
        <span data-id="event-name"></span>
      </div>
      <div class="data-row">
        <label>Parent</label>
        <span data-id="parent-info"></span>
      </div>
      <div class="data-row">
        <label>Reducer</label>
        <span class="ad-node-row">
          <span data-id="reducer-name"></span>
          <button class="ad-node-btn" data-action-btn="open-reducer" title="Open in editor" style="display:none">↗</button>
        </span>
      </div>
      <div class="data-row">
        <label>Emitted</label>
        <span data-id="emitted"></span>
      </div>
    </div>
    <!-- Payload (collapsible) -->
    <div class="ad-collapse-header" data-collapse-toggle>
      <span class="ad-section-label">Payload</span>
      <span class="ad-collapse-icon">▶</span>
    </div>
    <div data-collapse-content style="display:none;padding:0 10px 6px">
      <pre class="field-code" data-id="action-payload" style="max-height:200px"></pre>
    </div>
    <!-- State changes (replaced by JS) -->
    <div data-state-change-grid></div>
  </div>
</template>

<!-- NODE STATE CHANGES TEMPLATE -->
<template id="tpl-node-state-changes">
  <div data-node-state-changes>
    <div id="node-state-changes">
      <div class="data-section-title">State Changes</div>
      <div class="data-grid data-grid-2" data-state-change-grid>
        <div class="data-row data-row-header" data-state-change-field-row style="display:none">
          <span class="diff-label">Field</span>
          <span class="diff-field" data-id="field"></span>
        </div>
        <div class="data-row" data-state-change-before-row style="display:none">
          <span class="diff-label">Before</span>
          <span class="diff-before" data-id="before"></span>
        </div>
        <div class="data-row" data-state-change-after-row style="display:none">
          <span class="diff-label">After</span>
          <span class="diff-after" data-id="after"></span>
        </div>
        <div class="data-row" data-id="noChangeRow" style="display:none">
          <label class="single-row" data-id="noChangeTitle" >(No Change - Previous State)</label>
          <pre class="field-code single-row" data-id="noChangeState"></pre>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- STATE DETAILS TEMPLATE -->
<template id="tpl-state-details">
  <div class="data-grid data-grid-2" data-stat-grid>
    <div class="data-row-header"><span>NAME</span><span>VALUE</span></div>
    <div class="data-row" data-stat-row style="display:none">
      <span class="stat-label"></span>
      <span class="stat-value"></span>
    </div>
  </div>
</template>

<!-- NODE DETAILS TEMPLATE -->
<template id="tpl-node-details">
  <div class="g-node" data-node-details>
    <div class="g-header">
      <span class="g-header-text"></span>
      <span class="node-state-badge badge-amber" data-id="stateChangeIndicator" style="display:none">Change</span>
      <span class="node-fired-badge badge-green" data-id="firedIndicator"></span>
      <span class="node-breakpoint-badge badge-red" data-id="breakpointIndicator" style="display:none" title="Breakpoint — right-click to remove">⏸</span>
    </div>
    <div class="g-title">
      <span class="g-title-text"></span>
    </div>

    <div class="g-port in"></div>
    <div class="g-port out"></div>
  </div>
</template>

<!-- TIME SLIDER TEMPLATE -->
<template id="tpl-time-control-slider-overlay">
  <div class="time-controls-slider-overlay">
    Busy...
  </div>
</template>
<template id="tpl-timeline-filter-bar">
  <div class = "tl-filter-bar">
    <div class="tl-filter-group">
      <label class="tl-filter-label" for="tl-ev-select">Event</label>
      <div class="reducer-chip-grid" id="tl-ev-select"></div>
    </div>
    <div class="tl-filter-group">
      <label class="tl-filter-label" for="tl-act-select">Action</label>
      <div class="reducer-chip-grid" id="tl-act-select"></div>
    </div>
    <div class="tl-filter-group tl-date-slider-group">
      <label class="tl-filter-label">Date Range</label>
      <div class="tl-date-slider-labels">
        <span id="tl-date-label-start" class="tl-date-slider-label-val"></span>
        <span id="tl-date-label-end"   class="tl-date-slider-label-val"></span>
      </div>
      <div class="tl-date-slider-wrap">
        <input type="range" id="tl-date-start" class="tl-date-slider" min="0" max="100" value="0"   disabled>
        <input type="range" id="tl-date-end"   class="tl-date-slider" min="0" max="100" value="100" disabled>
      </div>
    </div>
    <button class="btn btn-sm"    id="tl-filter-clear"    title="Clear all filters">✕</button>
    <button class="btn btn-sm"   id="tl-download-csv"   title="Download visible rows as CSV">⬇ CSV</button>
  </div>
</template>

<!-- ── PERSON EDITOR TEMPLATE ───────────────────────── -->
<template id="tpl-person-editor">
  <div data-person-editor>
    <div class="node">
      <div class="node-header"><span>PERSON</span></div>
      <div class="node-body">
        <div class="node-field">
          <label>Name</label>
          <input data-id="name" placeholder="e.g. Alice"/>
        </div>
        <div class="node-field">
          <label>Birth Date</label>
          <input type="date" data-id="birthDate"/>
        </div>
        <div class="node-field">
          <label>Citizen</label>
          <select data-id="citizen" multiple style="flex:1;height:52px">
            <option value="US">US</option>
            <option value="AUS">AUS</option>
          </select>
        </div>
        <div class="node-field">
          <label>Life Exp.</label>
          <input type="number" data-id="lifeExpectancy" value="90"/>
        </div>
        <div class="node-field">
          <label>SS /mo</label>
          <input type="number" data-id="socialSecurityMonthly" value="2800"/>
        </div>
        <div class="node-field">
          <label>SS Currency</label>
          <select data-id="ssCurrency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Wage /mo</label>
          <input type="number" data-id="monthlyWage" value="0" min="0"/>
        </div>
        <div class="node-field">
          <label>Wage Currency</label>
          <select data-id="wageCurrency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Retire Date</label>
          <input type="date" data-id="retirementDate"/>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>

<!-- ── ACCOUNT EDITOR TEMPLATE ───────────────────────── -->
<template id="tpl-account-editor">
  <div data-account-editor>
    <div class="node">
      <div class="node-header"><span>ACCOUNT</span></div>
      <div class="node-body">
        <div class="node-field">
          <label>Name</label>
          <input data-id="name" placeholder="e.g. Primary Checking"/>
        </div>
        <div class="node-field">
          <label>Type</label>
          <select data-id="type">
            <option value="checking">Checking</option>
            <option value="savings">Savings</option>
            <option value="brokerage">Brokerage</option>
            <option value="401k">401(k)</option>
            <option value="roth">Roth IRA</option>
            <option value="ira">Traditional IRA</option>
            <option value="super">Superannuation</option>
            <option value="offset">Offset</option>
          </select>
        </div>
        <div class="node-field">
          <label>Balance</label>
          <input type="number" data-id="balance" value="0"/>
        </div>
        <div class="node-field" data-id="countryRow">
          <label>Country</label>
          <select data-id="country">
            <option value="US">US</option>
            <option value="AU">AU</option>
          </select>
        </div>
        <div class="node-field">
          <label>Currency</label>
          <select data-id="currency">
            <option value="USD">USD</option>
            <option value="AUD">AUD</option>
          </select>
        </div>
        <div class="node-field">
          <label>Ownership</label>
          <select data-id="ownershipType">
            <option value="sole">Sole</option>
            <option value="joint">Joint</option>
          </select>
        </div>
        <div class="node-field">
          <label>Owner</label>
          <select data-id="ownerId">
            <option value="">— none —</option>
          </select>
        </div>
        <div class="node-field">
          <label>Min Bal.</label>
          <input type="number" data-id="minimumBalance" value="0"/>
        </div>
        <div class="node-field" data-id="cashRateRow" style="display:none">
          <label>Interest Rate</label>
          <input type="number" step="0.001" data-id="cashRate" placeholder="blank = default"
                 title="The rate the bank quotes (absolute, e.g. 0.03 = 3%). Stored as a spread over the central-bank Prime rate, so a Prime move fans out to every linked account (design 56)."/>
          <div class="field-hint" data-id="cashRateHint" style="font-size:0.8em;opacity:0.7"></div>
        </div>
        <div class="node-field" data-id="transactionAccountRow" style="display:none">
          <label>Transaction Account</label>
          <input type="checkbox" data-id="isTransactionAccount"
                 title="Route this country's household cash (expenses, wages, contributions, taxes) through this account. Flag exactly one cash account per country."/>
        </div>
        <div class="node-field">
          <label>Drawdown</label>
          <input type="number" data-id="drawdownPriority" placeholder="blank = exclude"/>
        </div>
        <div data-id="investmentFields" style="display:none">
          <div class="node-field">
            <label>Contribution Basis</label>
            <input type="number" data-id="contributionBasis" placeholder="blank = balance (all principal)"/>
          </div>
          <div class="node-field">
            <label>Earnings Basis</label>
            <input type="number" data-id="earningsBasis" value="0" disabled title="Computed = balance − contributions"/>
          </div>
        </div>
        <div data-id="offsetFields" style="display:none">
          <div class="node-field">
            <label>Offsets Property</label>
            <select data-id="offsetsPropertyKey">
              <option value="">— none —</option>
            </select>
          </div>
        </div>
        <div data-id="holdingsSection" class="holdings-section" style="display:none">
          <div class="holdings-header">
            <span>Holdings</span>
            <button class="btn btn-xs" data-id="addHoldingBtn" type="button">+ Add</button>
            <button class="btn btn-xs" data-id="ladderBtn" type="button" title="Build a bond ladder — expands into N staggered individual bonds (design 66 §G8)">+ Bond ladder</button>
          </div>
          <!-- Bond-ladder builder (design 66 §G8). Expands (total, rungs, spacing,
               term, tax, coupon, roll, zero/TIPS) into N staggered BOND rungs that
               self-perpetuate via roll-to-tail. Hidden until "+ Bond ladder". -->
          <div data-id="ladderBuilder" class="ladder-builder" style="display:none">
            <label>Total <input class="ladder-input" data-lf="total" type="number" min="0" placeholder="Total $"/></label>
            <label>Rungs <input class="ladder-input" data-lf="rungs" type="number" min="2" max="30" value="5" style="width:4em"/></label>
            <label>Spacing (yr) <input class="ladder-input" data-lf="spacing" type="number" min="1" step="0.5" value="1" style="width:4em"/></label>
            <label>First rung (yr) <input class="ladder-input" data-lf="firstTerm" type="number" min="0" step="0.5" value="1" style="width:4em"/></label>
            <label>Tax
              <select class="ladder-input" data-lf="taxExemption">
                <option value="none">Taxable</option>
                <option value="state">Treasury</option>
                <option value="federal">Municipal</option>
                <option value="both">Muni (all-state)</option>
              </select>
            </label>
            <label>Coupon <input class="ladder-input" data-lf="couponRate" type="number" step="0.001" placeholder="market" style="width:5em"/></label>
            <label title="Coupon frequency — payments per year (design 66 §G10a)">Freq
              <select class="ladder-input" data-lf="couponFrequency">
                <option value="1">Annual</option>
                <option value="2" selected>Semi-ann.</option>
                <option value="4">Quarterly</option>
              </select>
            </label>
            <label title="Roll each maturing rung into a fresh bond at the ladder's full term — a self-perpetuating ladder (design 66 §G8). Off ⇒ rungs fall to cash as they mature (spend-down)."><input class="ladder-input" data-lf="roll" type="checkbox" checked/> Roll</label>
            <label title="Zero-coupon / OID ladder"><input class="ladder-input" data-lf="zeroCoupon" type="checkbox"/> Zero</label>
            <label title="TIPS / inflation-linked ladder"><input class="ladder-input" data-lf="inflationLinked" type="checkbox"/> TIPS</label>
            <button class="btn btn-xs btn-primary" data-id="ladderBuildBtn" type="button">Build</button>
            <button class="btn btn-xs" data-id="ladderCancelBtn" type="button">Cancel</button>
          </div>
          <table class="holdings-table">
            <thead>
              <tr>
                <th>Label</th>
                <th>Allocation</th>
                <th>Rate Key</th>
                <th class="num">Market Value</th>
                <th class="num">Cost Basis</th>
                <th class="num">Income Rate</th>
                <th class="num">Duration</th>
                <th>Tax Treatment</th>
                <th>Loss Partner</th>
                <th></th>
              </tr>
            </thead>
            <tbody data-id="holdingsTbody"></tbody>
          </table>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm" data-id="historyBtn" style="display:none">History</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>

          <input type="number" data-id="occupancyRate" value="0.95" step="0.01" title="Fraction realized (LTR ≈ 0.95, STR ≈ 0.55)"/>
        </div>
        <div class="node-field">
          <label>Expense Ratio</label>
          <input type="number" data-id="rentalExpenseRatio" value="0.25" step="0.01" title="Deductible cash opex as a fraction of gross rent"/>
        </div>
        <div class="node-field">
          <label>Mtg. Int. Rate</label>
          <input type="number" data-id="mortgageInterestRate" value="0" step="0.001" title="Annual mortgage interest rate the bank quotes (deductible). When Prime is configured it is stored as a spread over Prime (design 56), so a Prime move re-rates the loan."/>
          <div class="field-hint" data-id="mortgageRateHint" style="font-size:0.8em;opacity:0.7"></div>
        </div>
        <div class="node-field">
          <label>Land Value %</label>
          <input type="number" data-id="landValueRatio" value="0.2" step="0.01" title="Non-depreciable land fraction of cost basis"/>
        </div>
        <div class="node-field">
          <label>Deprec. Override</label>
          <input type="number" data-id="annualDepreciationOverride" placeholder="blank = derive" title="Explicit annual depreciation $; blank derives per-country"/>
        </div>
      </div>
      <div class="node-buttons">
        <button class="btn btn-sm btn-primary" data-id="saveBtn">Save</button>
        <button class="btn btn-sm btn-warn" data-id="deleteBtn" style="display:none">Delete</button>
      </div>
    </div>
  </div>
</template>
